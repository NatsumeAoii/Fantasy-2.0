<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Aetheris Character Forge</title>
  <meta name="description" content="A deterministic fantasy RPG character generator. Roll a seed, get a fully realized character — race, role, stats, inventory, lore, and backstory." />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Aetheris Character Forge" />
  <meta property="og:description" content="A deterministic fantasy RPG character generator. Roll a seed, get a fully realized character — race, role, stats, inventory, lore, and backstory." />
  <meta property="og:url" content="https://natsumeaoii.github.io/Aetheris-CharGen/" />
  <meta property="og:image" content="https://natsumeaoii.github.io/Aetheris-CharGen/og-image.svg" />
  <!-- [FILL IN] Replace og-image.svg with a 1200×630 PNG for maximum social media compatibility -->

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Aetheris Character Forge" />
  <meta name="twitter:description" content="A deterministic fantasy RPG character generator. Roll a seed, get a fully realized character — race, role, stats, inventory, lore, and backstory." />
  <meta name="twitter:image" content="https://natsumeaoii.github.io/Aetheris-CharGen/og-image.svg" />

  <!-- Canonical -->
  <link rel="canonical" href="https://natsumeaoii.github.io/Aetheris-CharGen/" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap"
    rel="stylesheet">

  <!-- FOUC Prevention: Apply saved theme before first paint -->
  <script>
    (function() {
      var theme = localStorage.getItem('theme');
      if (theme === 'light' || theme === 'dark') {
        document.documentElement.setAttribute('data-theme', theme);
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
